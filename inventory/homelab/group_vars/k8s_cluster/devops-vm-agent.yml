---
# devops-vm-agent on every node (playbook: inventory/homelab/devops-vm-agent.yml).
# The node pulls from the devops agent; nothing connects to it. Agent repo:
# https://github.com/nvlannasik/devops-ai-agent/tree/main/vm-agent

# present | absent (absent stops the service and removes the script, unit and config)
devops_vm_agent_state: present

# Pinned to one commit of devops-ai-agent; the checksums make a changed file fail the download.
# To upgrade: set the new commit and both sha256 values (git show <commit>:vm-agent/<file> | sha256sum).
devops_vm_agent_commit: 21707fb04baaf0eaa7a4ce5317d11db882c567f9
devops_vm_agent_sha256:
  devops-vm-agent.py: a29d026d9bb59d28fc456ebc7ba6c3e160fe768beb1a02f8f486fc901fcbedf8
  devops-vm-agent.service: 2afc04911b9d462090c40b8633ac8ddea1c79fcc6141a7a62c5be3d94883322b

# The name IS the node's identity at the agent and must equal its Kubernetes node name.
devops_vm_agent_name: "{{ inventory_hostname }}"
# Where the host sits (vm-agent 4+): the cluster as the devops agent names it (MCP_LOCAL_CLUSTER on
# the agent is `dev` for this cluster) and the Kubernetes node name. The agent's Hosts pages group by
# them and join them to Kubernetes. If another cluster also has a node with this name, give the
# token a different `devops_vm_agent_name` and keep `devops_vm_agent_node` the Kubernetes name.
devops_vm_agent_cluster: dev
devops_vm_agent_node: "{{ inventory_hostname }}"
# The LAN, not the public host: ingress-nginx's MetalLB IP, where a host-less /vm/ rule
# (gitops-devops-ai-manifest ingress-vm.yaml) reaches the agent without Cloudflare. Plain HTTP: the
# token is unencrypted on the LAN (https on that IP serves ingress-nginx's fake certificate).
devops_vm_agent_url: http://10.10.10.200
devops_vm_agent_poll_seconds: 10

# Units the agent may ask this node to restart. Empty on purpose: the agent refuses a restart on a
# Kubernetes node (remediation/node-gate.ts vmActionRefusal), so for now the node only registers.
# Never list etcd.service here.
devops_vm_agent_units: []

# The agent reads every node's token from Secret devops-tools/devops-vm-agent-tokens
# (key VM_AGENT_TOKENS, "name=token,..."). Tokens are generated on the Ansible host under
# inventory/homelab/credentials/devops-vm-agent/ (gitignored). With manage_secret the playbook
# owns that Secret (it overwrites it) and restarts the agent when it changes.
devops_vm_agent_manage_secret: true
devops_vm_agent_kubectl: kubectl
# Empty = whatever kubectl uses on the Ansible host ($KUBECONFIG, else ~/.kube/config, current context).
# Set a path (e.g. "{{ inventory_dir }}/artifacts/admin.conf") and/or a context to pin it.
devops_vm_agent_kubeconfig: ""
devops_vm_agent_kube_context: ""
devops_vm_agent_namespace: devops-tools
devops_vm_agent_secret: devops-vm-agent-tokens
devops_vm_agent_deployment: devops-ai-agent
