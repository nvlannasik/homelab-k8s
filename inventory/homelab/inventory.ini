# Kubespray v2.30 — HA stacked etcd (etcd jalan di 3 control plane)
# Mixed arch: *-raspi = arm64, *-vm = amd64 (Kubespray otomatis download binary sesuai arch tiap node)
#
# PENTING (v2.30): control plane BARU harus ditaruh di AKHIR grup kube_control_plane.
# Jangan pernah menambah CP sebagai entry pertama.

[kube_control_plane]
master2-vm    ansible_host=10.10.10.3 ip=10.10.10.3 etcd_member_name=etcd2 kube_vip_interface=enp0s3
master1-raspi ansible_host=10.10.10.2 ip=10.10.10.2 etcd_member_name=etcd1 kube_vip_interface=eth0
master3-vm    ansible_host=10.10.10.4 ip=10.10.10.4 etcd_member_name=etcd3 kube_vip_interface=enp0s3

[etcd:children]
kube_control_plane

[kube_node]
worker1-raspi ansible_host=10.10.10.11 ip=10.10.10.11
worker2-raspi ansible_host=10.10.10.12 ip=10.10.10.12
worker3-vm    ansible_host=10.10.10.13 ip=10.10.10.13

[k8s_cluster:children]
kube_control_plane
kube_node

# Grup bantu (bukan grup Kubespray) — dipakai prep-raspi.yml
[raspi]
master1-raspi
worker1-raspi
worker2-raspi

[all:vars]
ansible_user=nvlannasik
ansible_python_interpreter=/usr/bin/python3
